{{- /* chezmoi:modify-template */ -}}
{{- /*
  KeePassXC settings (only those differing from the defaults; KeePassXC drops
  default values itself). Window state and recent databases live in
  ~/.cache/keepassxc/keepassxc.ini, not here.

  [KeeShare] is copied from the existing file, never stored here: it holds a
  private key that KeePassXC generates per machine to sign shared groups.
  Sections are in the order KeePassXC writes them, so saving settings in the
  GUI doesn't show up as a diff.

  The work laptop keeps KeePassXC to itself: no browser integration and no
  SSH agent there (both are off by default).
*/ -}}
{{- $keeshare := .chezmoi.stdin | regexFind "(?ms)^\\[KeeShare\\]$.*?(?:\\n\\n|\\z)" | trim -}}
{{- $buratino := ne .chezmoi.hostname "malvina" -}}
[General]
ConfigVersion=2
HideWindowOnCopy=true
{{- if $buratino }}

[Browser]
CustomProxyLocation=
Enabled=true
{{- end }}

[FdoSecrets]
ConfirmAccessItem=true
ConfirmDeleteItem=true
Enabled=false
UnlockBeforeSearch=true

[GUI]
ApplicationTheme=auto
ColorPasswords=true
CompactMode=true
HideUsernames=true
MinimizeOnClose=true
MinimizeOnStartup=true
MinimizeToTray=true
MovableToolbar=false
ShowTrayIcon=true
TrayIconAppearance=monochrome-light
{{- if $keeshare }}

{{ $keeshare }}
{{- end }}

[PasswordGenerator]
AdditionalChars=
AdvancedMode=true
Braces=true
Dashes=true
ExcludedChars=
Length=20
Logograms=true
Math=true
Punctuation=true
Quotes=true
{{- if $buratino }}

[SSHAgent]
Enabled=true
{{- end }}
