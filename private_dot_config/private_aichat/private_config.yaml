# Haimaker's key goes in ~/.config/aichat/.env (HAIMAKER_API_KEY=…), which
# chezmoi doesn't manage. A role can pin another model in its front matter
# (`model: <client>:<model>`); `-m` picks one per call.
model: haimaker:meta/muse-spark-1.3-contributor
clients:
  - type: openai-compatible
    name: haimaker
    api_base: https://api.haimaker.ai/v1
    models:
      - name: meta/muse-spark-1.3-contributor
        max_input_tokens: 1048576
