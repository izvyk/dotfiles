<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Ubuntu only: NixOS sets this in nixos-config (see .chezmoiignore). The
     terminals ask for "monospace", so this is where their font is chosen. -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer><family>IosevkaTerm NF</family></prefer>
  </alias>
</fontconfig>
