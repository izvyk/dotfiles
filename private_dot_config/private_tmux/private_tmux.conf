# Works on tmux 3.4 (Ubuntu 24.04) and newer. No plugin manager: the few
# settings worth having from tmux-sensible, tmux-yank and the gruvbox theme are
# inline, so nothing is cloned from GitHub at startup.

# Terminal: truecolor in ghostty/foot (and xterm-256color, which ghostty sets
# over ssh), clipboard for foot (xterm* has it by default). Copying in copy mode
# or with the mouse goes to the system clipboard via OSC 52, over ssh as well.
# Programs inside tmux can't set the clipboard or pass escape sequences through
# to the terminal (set-clipboard external, allow-passthrough off: the defaults).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB,foot*:RGB:clipboard"
set -s escape-time 10     # Esc reaches vim at once, not after 500ms
set -g focus-events on
set -g history-limit 50000
set -g display-time 2000
set -g mouse on

# Windows and panes count from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and panes open in the current directory
bind -N "New window in the current directory" c new-window -c "#{pane_current_path}"
bind -N "Split top/bottom in the current directory" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split left/right in the current directory" % split-window -h -c "#{pane_current_path}"

# Pane navigation: prefix + hjkl, or Alt + arrows without the prefix.
# prefix ? lists all bindings (these with their notes), prefix / describes a key.
bind -N "Select the pane to the left" h select-pane -L
bind -N "Select the pane below" j select-pane -D
bind -N "Select the pane above" k select-pane -U
bind -N "Select the pane to the right (replaces: last window)" l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Copy mode: vi keys, v selects, C-v toggles a block, y copies and exits
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Gruvbox dark, transparent status bar
set -g status-style "bg=default,fg=#a89984"
set -g status-left "#[bg=#a89984,fg=#282828,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#7c6f64]#h  #[fg=#a89984]%d.%m.%Y %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#504945,fg=#fabd2f,bold] #I:#W#{?window_zoomed_flag, (zoom),} "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828"
set -g mode-style "bg=#504945,fg=#ebdbb2"
