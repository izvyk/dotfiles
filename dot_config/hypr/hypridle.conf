general {
    lock_cmd = systemctl --user start session-lock.target; pidof hyprlock || hyprlock
    unlock_cmd = systemctl --user stop session-lock.target
    before_sleep_cmd = loginctl lock-session && systemctl --user start screen-dim.service
    after_sleep_cmd = systemctl --user stop screen-dim.service
    inhibit_sleep = 1
}

listener {
    timeout = 300
    # on-timeout = touch /tmp/$USER-lock-with-grace && loginctl lock-session
    on-timeout = loginctl lock-session
}
listener {
    timeout = 330
    on-timeout = systemctl --user start screen-dim.service
    on-resume = systemctl --user stop screen-dim.service
}
listener {
    timeout = 90
    on-timeout = systemctl --user is-active -q session-lock.target && systemctl suspend-then-hibernate
}
listener {
    timeout = 360
    on-timeout = systemctl suspend-then-hibernate
}
